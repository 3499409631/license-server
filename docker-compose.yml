services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16
    container_name: license-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: license_server
    volumes:
      - license-postgres-data:/var/lib/postgresql/data

  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: license-server:latest
    container_name: license-server
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:manong666.@postgres:5432/license_server
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
      SERVER_ADDR: 0.0.0.0:3000
      APP_API_KEY: 901F0CF02D2B48D19966A4947E884398
      CLIENT_AES_KEY: client-aes-key-32-bytes-demo!!!!
      SERVER_AES_KEY: server-aes-key-32-bytes-demo!!!!

volumes:
  license-postgres-data:
